# CI for telemetry/: the same checks as debug.sh, minus the prompts and minus --fix.
# CI reports problems; it never edits code.
name: telemetry

on:
  push:
    paths:
      - "telemetry/**"
      - ".github/workflows/telemetry.yml"
  pull_request:
    paths:
      - "telemetry/**"
      - ".github/workflows/telemetry.yml"

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: telemetry
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0   # setup-uv publishes exact tags only; no floating v10
        # Python comes from telemetry/.python-version; uv installs it.

      - name: Install (locked)
        run: uv sync --locked    # fail if uv.lock is out of date with pyproject.toml

      - name: ruff
        run: uv run ruff check

      - name: mypy
        run: uv run mypy ./ --check-untyped-defs

      - name: pytest
        run: uv run pytest

      - name: Run on the sample data
        run: uv run telemetry data/sample_telemetry.csv "$RUNNER_TEMP/report"

      # Everything above tests the source tree through the dev venv (an editable install).
      # §8 is about the installed artifact, so install it and run it the way ops would.
      - name: Install as a tool
        run: |
          uv tool install .
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"   # on PATH for the steps below

      - name: Run as the customer
        working-directory: ${{ runner.temp }}   # outside the repo, no venv
        run: |
          which telemetry
          telemetry "$GITHUB_WORKSPACE/telemetry/data/sample_telemetry.csv" customer-report
          # Strict parse: json.tool and json.loads both accept -Infinity/NaN, which §7's dashboard doesn't.
          python3 -c "import json, sys; json.load(open(sys.argv[1]), parse_constant=lambda c: sys.exit(f'not valid JSON: {c}'))" customer-report/output.json
