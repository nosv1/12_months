[project]
name = "telemetry"
version = "0.1.0"
description = "A toy problem: import a telemetry CSV file, then parse, validate, analyze, and report on that data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
telemetry = "telemetry:cli"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
